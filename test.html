<style>

function about(){return '<section class="page container"><div class="wrap">'+heading("THE IDEA","About <em>Moonflower.</em>","A little context on the person, the collective, and why this space exists.")+'<div class="about-layout"><div class="about-quote">“Make the thing. See what works. Keep <em>making it better.</em>”</div><div class="about-copy"><p>I’m <strong>moon.d.flower</strong>. I like building websites, experimenting with interfaces, and turning ideas into projects that people can actually use.</p><p>A lot of the work lives somewhere between design and development: the layout, the little details, the way a page moves, and the code that makes everything function instead of just look good.</p><p><strong>The Forged Flowers</strong> is the collective connected to this space. This site gives the people and the projects room to exist together without turning everything into one giant profile page.</p><p>Nothing here needs to pretend it is finished. Projects change, designs get rebuilt, and the work keeps moving.</p></div></div><div class="value-grid"><article class="value-card"><span class="num">01 / BUILD</span><h3>Useful interfaces</h3><p>Web pages, app-like experiences, navigation, and details that work across devices.</p></article><article class="value-card"><span class="num">02 / CREATE</span><h3>A visual identity</h3><p>Artwork, banners, icons, and a consistent look that gives each project its own character.</p></article><article class="value-card"><span class="num">03 / IMPROVE</span><h3>Keep refining</h3><p>Testing the real experience, finding what breaks, and fixing it instead of leaving it half-done.</p></article></div><div style="margin-top:35px">'+button("SEE THE PROJECTS","work",true)+'</div></div></section>'}

function repositories(){return '<section class="page container"><div class="wrap">'+heading("PUBLIC SOURCE","Open-source <em>trail.</em>","A live list of public repositories from the GitHub profile. Search the names and descriptions.")+'<div class="repo-tools"><span class="eyebrow" id="repo-count">PUBLIC REPOSITORIES / LOADING</span><input class="repo-search" id="repo-search" type="search" placeholder="Search repositories…" aria-label="Search repositories"></div><div class="repo-grid" id="repo-grid"><div class="state">Connecting to GitHub…</div></div><div style="margin-top:25px">'+ext("OPEN GITHUB PROFILE","https://github.com/dhisjwhd-svg")+'</div></div></section>'}
function creator(){return '<section class="page container"><div class="wrap">'+heading("THE CREATOR","Moon.d.flower <em>online.</em>","A clearer look at the kind of work behind this profile and where to follow the latest posts.")+'<div class="about-layout"><div class="about-quote">“I like turning an idea into something you can <em>actually use.</em>”</div><div class="about-copy"><p>I’m <strong>moon.d.flower</strong>, an independent creator interested in building things for the web. I work across the visual side and the technical side: planning a layout, shaping its identity, writing the code, and improving how it works.</p><p>My projects include browser-based desktop ideas, media-library interfaces, asset collections, and smaller interactive experiments. They are works in progress, and I keep refining them as I learn.</p><p>I also share creative work through TikTok. This page intentionally does not invent video titles, view counts, or a content schedule; the profile below is the source for my actual posts.</p></div></div><div class="creator-page-grid"><article class="creator-page-card"><span class="num">01 / BUILD</span><h3>Web development</h3><p>Single-file HTML projects, responsive layouts, interactive navigation, and app-like browser experiences.</p></article><article class="creator-page-card"><span class="num">02 / DESIGN</span><h3>Interface & visual design</h3><p>Dark interfaces, custom branding, image systems, icons, and details that make each project feel coherent.</p></article><article class="creator-page-card"><span class="num">03 / EXPERIMENT</span><h3>Digital projects</h3><p>Lumio OS, media-library concepts, project directories, and other experiments built around real use cases.</p></article><article class="creator-page-card"><span class="num">04 / SHARE</span><h3>Creator updates</h3><p>Follow the TikTok profile to see the videos and ideas I’ve published directly, rather than a made-up feed embedded here.</p></article></div><div class="contact-panel" style="margin-top:32px"><div><div class="eyebrow">TIKTOK / @MOON.D.FLOWER</div><h2>Find me<br><em>over there.</em></h2><p>Visit the original profile for the latest videos and creator updates.</p></div><div class="contact-links"><a href="https://www.tiktok.com/@moon.d.flower" target="_blank" rel="noopener noreferrer"><span>OPEN TIKTOK PROFILE</span><b>↗</b></a><a href="https://github.com/dhisjwhd-svg" target="_blank" rel="noopener noreferrer"><span>EXPLORE MY GITHUB</span><b>↗</b></a><a href="https://github.com/dhisjwhd-svg/LUMIO-OS" target="_blank" rel="noopener noreferrer"><span>VIEW LUMIO OS</span><b>↗</b></a></div></div></div></section>'}
function contact(){return '<section class="page container"><div class="wrap">'+heading("FIND THE WORK","Stay <em>connected.</em>","Public places to follow the projects and find the original files.")+'<div class="contact-panel"><div><div class="eyebrow">MOON.D.FLOWER / THE FORGED FLOWERS</div><h2>See what<br><em>comes next.</em></h2><p>Browse the work, visit the source repositories, or check out the team profiles. The projects are always evolving.</p></div><div class="contact-links"><a href="https://github.com/dhisjwhd-svg" target="_blank" rel="noopener noreferrer"><span>GITHUB PROFILE</span><b>↗</b></a><a href="https://www.tiktok.com/@moon.d.flower" target="_blank" rel="noopener noreferrer"><span>TIKTOK / MOON.D.FLOWER</span><b>↗</b></a><a href="https://github.com/dhisjwhd-svg/moonflower" target="_blank" rel="noopener noreferrer"><span>MOONFLOWER REPOSITORY</span><b>↗</b></a><a href="https://github.com/dhisjwhd-svg/lumio-assets" target="_blank" rel="noopener noreferrer"><span>LUMIO ASSETS</span><b>↗</b></a></div></div></div></section>'}
function notFound(){return '<section class="page container"><div class="wrap"><div class="eyebrow">404 / NOT FOUND</div><h1 style="font-size:clamp(60px,10vw,110px);letter-spacing:-.1em">Wrong<br><em class="serif">turn.</em></h1><p class="muted">That page does not exist here.</p>'+button("BACK HOME","home",true)+'</div></section>'}
const routes={home,about,creator,team,work,repositories,contact};
function parse(){const bits=location.hash.replace(/^#\/?/,"").split("/");const name=bits[0]||"home";return{name:routes[name]||(["member"].includes(name)?member:notFound),key:name,id:bits[1]||""}}
function render(){const r=parse();app.innerHTML=r.key==="member"?member(r.id):(routes[r.key]||notFound)();document.querySelectorAll(".nav-link").forEach(n=>n.classList.toggle("active",n.dataset.route===r.key||(r.key==="member"&&n.dataset.route==="team")));mobileNav.classList.remove("open");menuToggle.setAttribute("aria-expanded","false");menuToggle.textContent="☰";document.title=(r.key==="member"?(MEMBERS.find(m=>m.id===r.id)?.name||"Member"):r.key==="home"?"Moonflower":r.key.charAt(0).toUpperCase()+r.key.slice(1))+" — The Forged Flowers";window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});if(r.key==="repositories")loadRepoView()}
function navigate(route){const hash="#"+route;if(location.hash===hash)render();else location.hash=hash}
document.addEventListener("click",e=>{const el=e.target.closest("[data-route]");if(!el)return;e.preventDefault();navigate(el.dataset.route)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&mobileNav.classList.contains("open")){mobileNav.classList.remove("open");menuToggle.setAttribute("aria-expanded","false");menuToggle.textContent="☰"}});
window.addEventListener("hashchange",render);
menuToggle.addEventListener("click",()=>{const open=mobileNav.classList.toggle("open");menuToggle.setAttribute("aria-expanded",String(open));menuToggle.textContent=open?"×":"☰"});
window.addEventListener("scroll",()=>{const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max>0?scrollY/max*100:0)+"%"},{passive:true});
async function loadRepoView(){const grid=document.getElementById("repo-grid"),count=document.getElementById("repo-count"),search=document.getElementById("repo-search");if(!grid||grid.dataset.loaded)return;try{const repos=await getRepos();if(!document.body.contains(grid))return;count.textContent="PUBLIC REPOSITORIES / "+repos.length;const paint=()=>{const q=(search.value||"").trim().toLowerCase(),filtered=repos.filter(r=>(r.name+" "+(r.description||"")+" "+(r.language||"")).toLowerCase().includes(q));grid.innerHTML=filtered.length?filtered.map(r=>'<a class="repo-card" href="'+esc(r.html_url)+'" target="_blank" rel="noopener noreferrer"><span class="eyebrow">REPOSITORY</span><h3>'+esc(r.name)+'</h3><p>'+esc(r.description||"A public project from Moonflower.")+'</p><span class="repo-foot"><span>'+esc((r.language||"PROJECT").toUpperCase())+'</span><span>OPEN ↗</span></span></a>').join(""):'<div class="state">No repositories match that search.</div>'};search.addEventListener("input",paint);paint();grid.dataset.loaded="true"}catch(err){if(!document.body.contains(grid))return;count.textContent="GITHUB PROFILE";grid.innerHTML='<div class="state">GitHub could not return the live repository list right now. You can still open the profile directly.</div>'}}
render();
})();
</script>
