<style>
:root {
  color-scheme: dark;
  --bg: #09090d;
  --surface: #111117;
  --surface-raised: #171720;
  --surface-soft: #1c1921;
  --line: rgba(255,255,255,.095);
  --line-strong: rgba(255,255,255,.16);
  --text: #f3eff4;

  --mono: "DM Mono", monospace;
  --sans: "Manrope", sans-serif;
  --serif: "Playfair Display", serif;
  --ease: cubic-bezier(.2,.75,.25,1);
  --header-height: 76px;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(ellipse 55% 45% at 94% -5%, rgba(108,76,127,.15), transparent 70%),
    radial-gradient(ellipse 48% 42% at -8% 48%, rgba(104,72,111,.1), transparent 72%),
    var(--bg);
  font-family: var(--sans);
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .12;
  background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 54px 54px;
  mask-image: linear-gradient(to bottom, black, transparent 75%);
}
a { color: inherit; text-decoration: none; }
button { color: inherit; font: inherit; }
img { display: block; max-width: 100%; }
svg { display: block; }
::selection { color: #fff; background: rgba(231,168,196,.38); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--pink); outline-offset: 4px; }
#reading-progress { position: fixed; z-index: 100; top: 0; left: 0; width: 0; height: 2px; background: linear-gradient(90deg,var(--pink),var(--lavender)); }
.ambient {
  position: fixed;
  z-index: -1;
  width: 44vw;
  height: 44vw;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(90px);
  opacity: .08;
}
.ambient.one { top: -25vw; right: -12vw; background: #c47da5; }
.ambient.two { bottom: -30vw; left: -15vw; background: #7770b3; }
.wrap { width: min(1160px, 90vw); margin-inline: auto; }

  color: var(--pink);
  font: 10px var(--mono);
  letter-spacing: .17em;
  text-transform: uppercase;
}

  position: sticky;
  z-index: 70;

  backdrop-filter: blur(18px);

}
.nav-inner { min-height: var(--header-height); display: flex; align-items: center; justify-content: space-between; gap: 20px; }

  display: inline-flex;

}

}

.home-hero { position: relative; padding: 104px 0 84px; overflow: hidden; }
.home-grid { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(250px,.8fr); align-items: center; gap: 55px; }

.team-card-foot { display: flex; align-items: center; justify-content: space-between; color: var(--dim); font: 9px var(--mono); letter-spacing: .1em; }

.profile-layout { display: grid; grid-template-columns: minmax(0,1fr) 290px; gap: 28px; align-items: start; }

.profile-handle { margin-top: 7px; color: var(--muted); font: 11px var(--mono); }

.project-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 13px; }

  padding: 24px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: linear-gradient(145deg,#171720,#0e0e14);
  cursor: pointer;
  transition: transform .25s,border-color .25s;

.project-card:hover { transform: translateY(-4px); border-color: rgba(231,168,196,.46); }

let repoCache = null;
let repoLoading = null;
async function loadRepositories() {
  if (repoCache) return repoCache;
  if (repoLoading) return repoLoading;
  repoLoading = fetch("https://api.github.com/users/dhisjwhd-svg/repos?sort=updated&per_page=100", {
    headers: { Accept: "application/vnd.github+json" }
  }).then(response => {
    if (!response.ok) throw new Error("GitHub returned " + response.status);
    return response.json();
  }).then(data => {
    const priority = ["LUMIO-OS","lumio-assets","driven","pc-wallpaper-assets-","moonflower"];
    repoCache = data.filter(repo => !repo.fork).sort((a,b) => {
      const ai = priority.indexOf(a.name);
      const bi = priority.indexOf(b.name);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi) || new Date(b.updated_at) - new Date(a.updated_at);
    });
    return repoCache;
  }).finally(() => { repoLoading = null; });
  return repoLoading;
}

function repositoriesPage() {
  return '<section class="page page-shell" data-page="repositories"><div class="wrap">' +
    pageHeading("PUBLIC SOURCE", "Straight from <em>GitHub.</em>", "The live public repository list for dhisjwhd-svg. Open a repository to see its files, commits, and current state.") +
    '<div class="repo-toolbar"><span class="eyebrow" id="repo-count">PUBLIC REPOSITORIES / LOADING</span><span class="muted" id="repo-status" style="font-size:10px">Connecting to GitHub…</span></div>' +
    '<div class="repo-grid" id="repo-grid"><div class="repo-state">Loading the public repository list…</div></div>' +
    '<div class="button-row" style="margin-top:26px">' + externalLink("OPEN GITHUB PROFILE", "https://github.com/dhisjwhd-svg", true) + '</div>' +
  '</div></section>';
}

function contactPage() {
  return '<section class="page page-shell" data-page="contact"><div class="wrap">' +
    pageHeading("FIND THE WORK", "Places to <em>connect.</em>", "The links below go to the public profiles and project pages. No contact form that goes nowhere.") +
    '<div class="contact-panel"><div><div class="eyebrow">MOON.D.FLOWER / THE FORGED FLOWERS</div>' +
    '<h2>Come see<br><em>what’s next.</em></h2>' +
    '<p>Follow the work, browse the repositories, or check out the team profiles. The projects change as I keep building, so the GitHub profile is the best place to see the latest files.</p>' +
    '</div><div class="contact-list">' +
    contactLink("GITHUB PROFILE", "https://github.com/dhisjwhd-svg") +
    contactLink("TIKTOK / MOON.D.FLOWER", "https://www.tiktok.com/@moon.d.flower") +
    contactLink("MOONFLOWER REPOSITORY", "https://github.com/dhisjwhd-svg/moonflower") +
    contactLink("THE FORGED FLOWERS PROFILES", "https://github.com/dhisjwhd-svg/lumio-assets/blob/main/assets/apps/TFF.html") +
    '</div></div></div></section>';
}

function contactLink(label, url) {
  return '<a href="' + escapeHTML(url) + '" target="_blank" rel="noopener noreferrer"><span>' + escapeHTML(label) + '</span>' + ICON.external + '</a>';
}

function notFoundPage() {
  return '<section class="page page-shell"><div class="wrap"><div class="eyebrow">404 / NOT FOUND</div><h1 class="display-title" style="margin-top:20px">This page<br><em>isn’t here.</em></h1><p class="lead">That link doesn’t match a page on this site.</p><div class="button-row">' + button("BACK HOME", "home", true) + '</div></div></section>';
}

const ROUTES = {
  home: homePage,
  about: aboutPage,
  team: teamPage,
  projects: projectsPage,
  gallery: galleryPage,
  repositories: repositoriesPage,
  contact: contactPage
};

function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, "");
  if (!raw) return { name: "home", id: null };
  const [name, id] = raw.split("/");
  if (name === "member" || name === "project") return { name, id: decodeURIComponent(id || "") };
  return { name: ROUTES[name] ? name : "not-found", id: null };
}

function renderRoute(route, animate = true) {
  const current = app.querySelector(".page");
  const view = route.name === "member" ? memberPage(route.id)
    : route.name === "project" ? projectPage(route.id)
    : route.name === "not-found" ? notFoundPage()
    : (ROUTES[route.name] || notFoundPage)();
  if (current && animate && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    current.classList.add("page-out");
    window.setTimeout(() => {
      app.innerHTML = view;
      finishRender(route);
    }, 110);
  } else {
    app.innerHTML = view;
    finishRender(route);
  }
}

function finishRender(route) {
  document.title = route.name === "home" ? "moon.d.flower | The Forged Flowers"
    : route.name === "member" ? (MEMBERS.find(m => m.id === route.id)?.name || "Member") + " | The Forged Flowers"
    : route.name === "project" ? (PROJECTS.find(p => p.id === route.id)?.name || "Project") + " | Moonflower"
    : route.name.charAt(0).toUpperCase() + route.name.slice(1) + " | Moonflower";
  document.querySelectorAll(".nav-link").forEach(link => {
    link.classList.toggle("active", link.dataset.route === route.name ||
      (route.name === "member" && link.dataset.route === "team") ||
      (route.name === "project" && link.dataset.route === "projects"));
  });
  mobilePanel.classList.remove("open");
  mobileToggle.setAttribute("aria-expanded", "false");
  progress.style.width = "0";
  window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  if (route.name === "repositories") populateRepositories();
}

function navigate(route) {
  const next = "#" + route;
  if (location.hash === next) {
    

renderRoute(parseRoute(), false);
    return;
  }
  location.hash = next;
}

document.addEventListener("click", event => {
  const target = event.target.closest("[data-route]");
  if (!target) return;
  event.preventDefault();
  navigate(target.dataset.route);
});

window.addEventListener("hashchange", () => renderRoute(parseRoute()));
mobileToggle.addEventListener("click", () => {
  const open = mobilePanel.classList.toggle("open");
  mobileToggle.setAttribute("aria-expanded", String(open));
  document.getElementById("menu-icon").innerHTML = open
    ? '<path d="m6 6 12 12M18 6 6 18"/>'
    : '<path d="M4 7h16M4 12h16M4 17h16"/>';
});

window.addEventListener("scroll", () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  progress.style.width = (max > 0 ? scrollY / max * 100 : 0) + "%";
}, { passive: true });

async function populateRepositories() {
  const grid = document.getElementById("repo-grid");
  const count = document.getElementById("repo-count");
  const status = document.getElementById("repo-status");
  if (!grid || grid.dataset.loaded === "true") return;
  try {
    const repos = await loadRepositories();
    if (!document.body.contains(grid)) return;
    count.textContent = "PUBLIC REPOSITORIES / " + repos.length;
    status.textContent = "LIVE FROM GITHUB";
    grid.innerHTML = repos.map(repo =>
      '<a class="repo-card" href="' + escapeHTML(repo.html_url) + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="eyebrow">REPOSITORY</span><h3>' + escapeHTML(repo.name) + '</h3>' +
      '<p>' + escapeHTML(repo.description || "A public project from the Moonflower workspace.") + '</p>' +
      '<span class="repo-foot"><span>' + escapeHTML((repo.language || "PROJECT").toUpperCase()) + '</span><span>OPEN REPOSITORY</span></span></a>'
    ).join("") || '<div class="repo-state">No public repositories were returned.</div>';
    grid.dataset.loaded = "true";
  } catch (error) {
    if (!document.body.contains(grid)) return;
    count.textContent = "GITHUB PROFILE";
    status.textContent = "LIVE LIST UNAVAILABLE";
    grid.innerHTML = '<div class="repo-state">GitHub did not return the repository list just now. The profile link still works.</div>';
  }
}

/* --------------------------------------------------------------------------
   Gallery viewer
   Opens artwork in a focused overlay. The selected item can be changed with
   the on-screen controls, keyboard keys, or a horizontal touch gesture.
   -------------------------------------------------------------------------- */
const lightbox = document.createElement("section");
lightbox.className = "lightbox";
lightbox.hidden = true;
lightbox.setAttribute("role", "dialog");
lightbox.setAttribute("aria-modal", "true");
lightbox.setAttribute("aria-label", "Image viewer");
lightbox.innerHTML =
  '<div class="lightbox-top"><span id="lightbox-index">IMAGE 01</span>' +
  '<div class="lightbox-controls"><button class="lightbox-control" id="lightbox-close" aria-label="Close image viewer">' +
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></div>' +
  '<div class="lightbox-stage"><img id="lightbox-image" alt=""></div>' +
  '<div class="lightbox-bottom"><span id="lightbox-caption"></span>' +
  '<div class="lightbox-controls"><button class="lightbox-control" id="lightbox-prev" aria-label="Previous image">' +
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 12H5m7 7-7-7 7-7"/></svg></button>' +
  '<button class="lightbox-control" id="lightbox-next" aria-label="Next image">' +
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></button></div></div>';
document.body.appendChild(lightbox);

let galleryItems = [];
let galleryIndex = 0;
let previousFocus = null;
let touchStartX = null;

function refreshGalleryItems() {
  galleryItems = Array.from(document.querySelectorAll(".gallery-item")).map(figure => {
    const image = figure.querySelector("img");
    const caption = figure.querySelector("figcaption span");
    return {
      src: image ? image.currentSrc || image.src : "",
      alt: image ? image.alt : "",
      title: caption ? caption.textContent : "Gallery image"
    };
  }).filter(item => item.src);
}

function showGalleryImage(index) {
  if (!galleryItems.length) return;
  galleryIndex = (index + galleryItems.length) % galleryItems.length;
  const item = galleryItems[galleryIndex];
  const image = document.getElementById("lightbox-image");
  image.src = item.src;
  image.alt = item.alt;
  document.getElementById("lightbox-caption").textContent = item.title;
  document.getElementById("lightbox-index").textContent =
    "IMAGE " + String(galleryIndex + 1).padStart(2,"0") + " / " +
    String(galleryItems.length).padStart(2,"0");
}

function openGalleryImage(index) {
  refreshGalleryItems();
  if (!galleryItems.length) return;
  previousFocus = document.activeElement;
  showGalleryImage(index);
  lightbox.hidden = false;
  document.body.style.overflow = "hidden";
  document.getElementById("lightbox-close").focus();
}

function closeGalleryImage() {
  if (lightbox.hidden) return;
  lightbox.hidden = true;
  document.body.style.overflow = "";
  if (previousFocus && typeof previousFocus.focus === "function") previousFocus.focus();
}

document.addEventListener("click", event => {
  const image = event.target.closest(".gallery-item img");
  if (!image) return;
  const figure = image.closest(".gallery-item");
  const figures = Array.from(document.querySelectorAll(".gallery-item"));
  openGalleryImage(figures.indexOf(figure));
});

document.getElementById("lightbox-close").addEventListener("click", closeGalleryImage);
document.getElementById("lightbox-prev").addEventListener("click", () => showGalleryImage(galleryIndex - 1));
document.getElementById("lightbox-next").addEventListener("click", () => showGalleryImage(galleryIndex + 1));
lightbox.addEventListener("click", event => {
  if (event.target === lightbox) closeGalleryImage();
});
document.addEventListener("keydown", event => {
  if (lightbox.hidden) return;
  if (event.key === "Escape") closeGalleryImage();
  if (event.key === "ArrowLeft") showGalleryImage(galleryIndex - 1);
  if (event.key === "ArrowRight") showGalleryImage(galleryIndex + 1);
});
lightbox.addEventListener("touchstart", event => {
  touchStartX = event.changedTouches[0].clientX;
}, { passive: true });
lightbox.addEventListener("touchend", event => {
  if (touchStartX === null) return;
  const distance = event.changedTouches[0].clientX - touchStartX;
  if (Math.abs(distance) > 55) showGalleryImage(galleryIndex + (distance < 0 ? 1 : -1));
  touchStartX = null;
}, { passive: true });


renderRoute(parseRoute(), false);
})();
</script>
