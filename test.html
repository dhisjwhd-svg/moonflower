<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="description" content="Moon.d.flower — independent web projects, interactive interfaces, creative experiments, and The Forged Flowers.">
<meta property="og:title" content="Moonflower — Moon.d.flower">
<meta property="og:description" content="Web projects, interactive experiments, and The Forged Flowers.">
<meta property="og:type" content="website">
<title>Moonflower — The Forged Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light; --bg:#f2f0e8; --panel:#fffdf7; --panel2:#e7eee8; --ink:#192b29; --muted:#596760; --quiet:#78847c; --line:rgba(25,43,41,.14); --line2:rgba(25,43,41,.27); --lilac:#246bfe; --pink:#f0784f; --acid:#c4df43; --teal:#149c91; --gold:#e3b34c; --mono:"DM Mono",monospace; --sans:"DM Sans",sans-serif; --serif:"Instrument Serif",serif; --ease:cubic-bezier(.2,.75,.2,1); --header:76px}
*{box-sizing:border-box}
html{background:var(--bg); scroll-behavior:smooth}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--sans); overflow-x:hidden}
body:before{content:""; position:fixed; inset:0; z-index:-2; pointer-events:none; background:radial-gradient(ellipse at 78% 0%,rgba(20,156,145,.17),transparent 36%),radial-gradient(ellipse at 5% 65%,rgba(227,179,76,.13),transparent 35%)}
body:after{content:""; position:fixed; inset:0; z-index:20; pointer-events:none; opacity:.12; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E")}
a{color:inherit; text-decoration:none}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
img{display:block; max-width:100%}::selection{background:var(--lilac); color:#fffdf7}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acid); outline-offset:4px}
.wrap{width:min(1240px,90vw); margin:auto}
.mono,.eyebrow,.micro,.nav-link,.meta{font-family:var(--mono); text-transform:uppercase; letter-spacing:.13em}
.eyebrow{font-size:10px; color:var(--lilac)}
.micro{font-size:9px; color:var(--quiet)}
.muted{color:var(--muted)}
#progress{position:fixed; z-index:100; top:0; left:0; width:0; height:2px; background:linear-gradient(90deg,var(--pink),var(--lilac),var(--acid))}
.site-header{height:var(--header); position:sticky; top:0; z-index:80; border-bottom:1px solid var(--line); background:rgba(242,240,232,.88); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px)}
.header-inner{height:100%; display:flex; align-items:center; justify-content:space-between; gap:24px}
.brand{display:flex; align-items:center; gap:12px; border:0; background:none; padding:0; text-align:left}
.brand-symbol{width:38px; height:38px; display:grid; place-items:center; border:1px solid rgba(36,107,254,.5); border-radius:50%; color:var(--lilac); font-size:21px; line-height:1}
.brand-name{font-size:14px; font-weight:800; letter-spacing:-.06em}
.brand-sub{display:block; margin-top:3px; font:8px var(--mono); letter-spacing:.18em; color:var(--quiet)}
.desktop-nav{display:flex; align-items:center; gap:4px}
.nav-link{height:38px; padding:0 13px; border:1px solid transparent; background:transparent; color:#aaa5ad; font-size:9px; transition:.2s}
.nav-link:hover,.nav-link.active{color:var(--ink); border-color:var(--line); background:rgba(25,43,41,.04)}
.nav-link.active{color:var(--lilac)}
.header-right{display:flex; align-items:center; gap:10px}
.github-link,.menu-toggle{height:39px; display:flex; align-items:center; justify-content:center; gap:9px; padding:0 14px; border:1px solid var(--line2); background:transparent; font:9px var(--mono); letter-spacing:.1em; transition:.2s}
.github-link:hover,.menu-toggle:hover{border-color:var(--lilac); background:rgba(36,107,254,.08)}
.menu-toggle{display:none; width:40px; padding:0}
.mobile-nav{display:none; position:absolute; top:100%; left:0; right:0; padding:12px 5vw 18px; background:rgba(9,9,11,.97); border-bottom:1px solid var(--line)}
.mobile-nav.open{display:grid; grid-template-columns:repeat(2,1fr); gap:7px}
.mobile-nav button{min-height:43px; border:1px solid var(--line); background:var(--panel); font:9px var(--mono); letter-spacing:.12em}
#app{min-height:70vh}
.page{animation:appear .45s var(--ease) both}
@keyframes appear{from{opacity:0; transform:translateY(12px)}
to{opacity:1; transform:none}}
.container{padding:76px 0 110px}
.section-top{display:flex; justify-content:space-between; align-items:end; gap:32px; margin-bottom:46px}
.section-top h1{font-size:clamp(48px,8vw,100px); line-height:.9; letter-spacing:-.095em; font-weight:600; margin:15px 0 0}
.section-top h1 em,.serif{font-family:var(--serif); font-weight:400; font-style:italic; color:var(--lilac)}
.section-top p{max-width:360px; margin:0; color:var(--muted); font-size:13px; line-height:1.9}
.hero{padding:94px 0 74px; position:relative}
.hero-grid{display:grid; grid-template-columns:minmax(0,1.12fr) minmax(290px,.88fr); gap:7vw; align-items:center}
.hero-kicker{display:flex; align-items:center; gap:11px}
.hero-kicker:before{content:""; width:26px; height:1px; background:var(--lilac)}
.hero-title{margin:28px 0 25px; font-size:clamp(70px,11.5vw,150px); line-height:.78; letter-spacing:-.115em; font-weight:600}
.hero-title .line2{display:block; margin-left:.42em; color:var(--lilac); font-family:var(--serif); font-style:italic; font-weight:400; letter-spacing:-.075em}
.hero-description{max-width:490px; color:#b6b0b8; font-size:14px; line-height:2}
.hero-description strong{color:var(--ink); font-weight:700}
.hero-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:30px}
.button{min-height:47px; display:inline-flex; align-items:center; justify-content:center; gap:15px; padding:0 17px; border:1px solid var(--line2); background:rgba(25,43,41,.025); font:9px var(--mono); letter-spacing:.1em; transition:transform .22s,border-color .22s,background .22s}
.button:hover{transform:translateY(-3px); border-color:var(--lilac); background:rgba(36,107,254,.1)}
.button.primary{background:var(--ink); color:var(--ink); border-color:var(--ink)}
.button.primary:hover{background:var(--lilac); border-color:var(--lilac)}
.button .arrow{font-size:17px}
.hero-art{position:relative; max-width:460px; justify-self:end; width:100%; aspect-ratio:4/5; padding:9px; border:1px solid var(--line2); background:var(--panel2); transform:rotate(1.5deg)}
.hero-art img{width:100%; height:100%; object-fit:cover; object-position:center}
.hero-art:after{content:""; position:absolute; inset:9px; background:linear-gradient(180deg,transparent 58%,rgba(25,43,41,.78))}
.art-label{position:absolute; z-index:2; left:27px; right:25px; bottom:25px; display:flex; justify-content:space-between; gap:12px; color:#fff; font:9px var(--mono); letter-spacing:.14em}
.hero-index{position:absolute; right:-35px; top:28px; writing-mode:vertical-rl; color:var(--quiet); font:9px var(--mono); letter-spacing:.2em}
.ticker{overflow:hidden; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:17px 0; background:rgba(25,43,41,.015)}
.ticker-track{display:flex; align-items:center; justify-content:space-around; gap:36px; white-space:nowrap; color:#aaa3ae; font:9px var(--mono); letter-spacing:.17em}
.ticker-track span{display:flex; align-items:center; gap:30px}
.ticker-track b{color:var(--lilac); font-size:15px; font-weight:400}
.home-sections{padding:82px 0 100px}
.section-heading{display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:25px}
.section-heading h2{margin:10px 0 0; font-size:clamp(34px,5vw,60px); line-height:.95; letter-spacing:-.08em; font-weight:600}
.text-link{display:inline-flex; align-items:center; gap:12px; color:var(--lilac); font:9px var(--mono); letter-spacing:.1em}
.text-link:hover{color:var(--acid)}
.project-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.project-card{min-height:260px; position:relative; overflow:hidden; padding:22px; border:1px solid var(--line); background:linear-gradient(145deg,var(--panel2),var(--panel)); display:flex; flex-direction:column; transition:transform .25s,border-color .25s}
.project-card:hover{transform:translateY(-5px); border-color:rgba(36,107,254,.55)}
.project-card:before{content:""; position:absolute; width:190px; height:190px; right:-100px; bottom:-120px; border-radius:50%; background:var(--glow,var(--lilac)); filter:blur(70px); opacity:.18}
.project-top{display:flex; justify-content:space-between; color:var(--quiet); font:9px var(--mono); letter-spacing:.14em}
.project-mark{width:38px; height:38px; border:1px solid var(--line); border-radius:50%; display:grid; place-items:center; color:var(--lilac); font-size:17px}
.project-card h3{margin:auto 0 9px; font-size:26px; letter-spacing:-.07em; font-weight:600}
.project-card p{max-width:330px; margin:0; color:var(--muted); font-size:11px; line-height:1.8}
.project-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:23px; padding-top:14px; border-top:1px solid var(--line); font:8px var(--mono); letter-spacing:.12em; color:#bcb5c0}
.project-bottom b{color:var(--lilac); font-size:16px; font-weight:400}
.collective-band{display:grid; grid-template-columns:.9fr 1.1fr; gap:5vw; align-items:center; padding:70px 0 0; border-top:1px solid var(--line); margin-top:90px}
.collective-band h2{font-size:clamp(42px,6vw,76px); line-height:.88; letter-spacing:-.09em; margin:14px 0}
.collective-band h2 em{font:italic 400 1em var(--serif); color:var(--pink)}
.collective-band p{max-width:520px; color:var(--muted); font-size:13px; line-height:2}
.collective-image{height:290px; overflow:hidden; border:1px solid var(--line)}
.collective-image img{width:100%; height:100%; object-fit:cover}
.member-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.member-card{border:1px solid var(--line); background:var(--panel); overflow:hidden; cursor:pointer; text-align:left; padding:0; transition:transform .25s,border-color .25s}
.member-card:hover{transform:translateY(-5px); border-color:rgba(36,107,254,.6)}
.member-banner{height:180px; overflow:hidden; background:#dce8df}
.member-banner img{width:100%; height:100%; object-fit:cover; transition:transform .5s}
.member-card:hover .member-banner img{transform:scale(1.045)}
.member-body{padding:0 20px 20px}
.member-avatar{width:82px; height:82px; object-fit:cover; border-radius:50%; border:4px solid var(--panel); margin-top:-42px; position:relative; background:#dce8df}
.member-role{margin-top:13px; color:var(--lilac); font:9px var(--mono); letter-spacing:.14em}
.member-name{font-size:23px; letter-spacing:-.06em; margin:8px 0 2px}
.member-handle{font:10px var(--mono); color:var(--quiet)}
.member-bio{min-height:55px; margin:17px 0; color:#bdb6c1; font-size:11px; line-height:1.8}
.member-foot{display:flex; justify-content:space-between; padding-top:14px; border-top:1px solid var(--line); font:8px var(--mono); letter-spacing:.12em; color:#aaa2ad}
.member-foot b{color:var(--lilac); font-size:15px; font-weight:400}
.profile-cover{height:clamp(220px,34vw,390px); overflow:hidden; border:1px solid var(--line); background:#e7eee8}
.profile-cover img{width:100%; height:100%; object-fit:cover}
.profile-card{display:grid; grid-template-columns:1fr 270px; gap:26px; margin-top:-48px; position:relative}
.profile-main{padding:0 28px 28px}
.profile-avatar{width:108px; height:108px; border:5px solid var(--bg); border-radius:50%; object-fit:cover; background:#dce8df}
.profile-main h1{font-size:clamp(42px,6vw,70px); letter-spacing:-.09em; margin:17px 0 2px}
.profile-handle{font:11px var(--mono); color:var(--muted)}
.profile-bio{max-width:650px; margin:24px 0; color:#c6bec9; font-size:14px; line-height:1.9; white-space:pre-line}
.profile-links{display:flex; gap:9px; flex-wrap:wrap; padding-top:20px; border-top:1px solid var(--line)}
.social{display:flex; align-items:center; gap:10px; min-height:42px; padding:0 14px; border:1px solid var(--line); font-size:11px}
.social:hover{border-color:var(--lilac); background:rgba(36,107,254,.08)}
.profile-aside{align-self:start; margin-top:58px; padding:22px; border:1px solid var(--line); background:var(--panel)}
.profile-aside h3{margin:12px 0; font-size:15px}
.profile-aside p{color:var(--muted); font-size:11px; line-height:1.9}
.profile-aside .button{width:100%; margin-top:8px}
.about-layout{display:grid; grid-template-columns:.8fr 1.2fr; gap:7vw}
.about-quote{font:clamp(31px,4vw,53px)/1.18 var(--serif); color:#e8dce9}
.about-quote em{color:var(--pink)}
.about-copy{color:#b9b2bd; font-size:13px; line-height:2.05}
.about-copy p{margin:0 0 18px}
.about-copy strong{color:var(--ink)}
.value-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:55px}
.value-card{padding:23px; border:1px solid var(--line); background:rgba(25,43,41,.018)}
.value-card .num{font:9px var(--mono); color:var(--lilac)}
.value-card h3{margin:28px 0 8px; font-size:18px; letter-spacing:-.04em}
.value-card p{margin:0; color:var(--muted); font-size:11px; line-height:1.8}
.work-list{display:grid; gap:10px}
.work-row{display:grid; grid-template-columns:70px 1fr 1.1fr auto; align-items:center; gap:20px; padding:23px; border:1px solid var(--line); background:rgba(25,43,41,.018); transition:border-color .2s,background .2s}
.work-row:hover{border-color:rgba(36,107,254,.5); background:rgba(36,107,254,.04)}
.work-number{font:10px var(--mono); color:var(--lilac)}
.work-row h3{margin:0; font-size:21px; letter-spacing:-.06em}
.work-row p{margin:0; color:var(--muted); font-size:11px; line-height:1.8}
.work-type{font:8px var(--mono); letter-spacing:.12em; color:var(--quiet)}
.repo-tools{display:flex; align-items:center; justify-content:space-between; gap:15px; margin-bottom:17px}
.repo-search{width:min(350px,100%); height:43px; padding:0 14px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:11px var(--mono)}
.repo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:11px}
.repo-card{display:flex; min-height:170px; flex-direction:column; padding:19px; border:1px solid var(--line); background:rgba(25,43,41,.02); transition:transform .2s,border-color .2s}
.repo-card:hover{transform:translateY(-3px); border-color:var(--lilac)}
.repo-card h3{margin:15px 0 7px; font-size:16px; letter-spacing:-.04em}
.repo-card p{margin:0 0 15px; color:var(--muted); font-size:10px; line-height:1.8}
.repo-foot{display:flex; justify-content:space-between; gap:10px; margin-top:auto; color:var(--lilac); font:8px var(--mono); letter-spacing:.1em}
.state{padding:22px; border:1px solid var(--line); color:var(--muted); font-size:12px; line-height:1.8}
.creator-panel{display:grid; grid-template-columns:1fr .8fr; gap:5vw; align-items:center; margin:76px 0 0; padding:32px; border:1px solid var(--line); background:linear-gradient(125deg,rgba(36,107,254,.09),rgba(25,43,41,.012))}
.creator-panel h2{margin:12px 0; font-size:clamp(36px,5vw,58px); line-height:.95; letter-spacing:-.08em}
.creator-panel p{max-width:520px; color:var(--muted); font-size:12px; line-height:1.95}
.creator-panel .creator-actions{display:flex; gap:9px; flex-wrap:wrap; margin-top:20px}
.creator-list{display:grid; gap:9px}
.creator-item{padding:17px; border:1px solid var(--line); background:rgba(25,43,41,.018)}
.creator-item b{display:block; margin-bottom:6px; font-size:13px}
.creator-item span{color:var(--muted); font-size:10px; line-height:1.8}
.creator-page-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:30px}
.creator-page-card{padding:24px; border:1px solid var(--line); background:rgba(25,43,41,.02)}
.creator-page-card .num{font:9px var(--mono); color:var(--lilac)}
.creator-page-card h3{margin:22px 0 8px; font-size:21px; letter-spacing:-.06em}
.creator-page-card p{margin:0; color:var(--muted); font-size:11px; line-height:1.9}
.contact-panel{display:grid; grid-template-columns:1fr .8fr; gap:5vw; padding:36px; border:1px solid var(--line); background:linear-gradient(130deg,rgba(36,107,254,.08),rgba(25,43,41,.012))}
.contact-panel h2{font-size:clamp(42px,6vw,76px); line-height:.9; letter-spacing:-.09em; margin:15px 0}
.contact-panel h2 em{font:italic 400 1em var(--serif); color:var(--pink)}
.contact-panel p{max-width:440px; color:var(--muted); font-size:12px; line-height:1.9}
.contact-links{display:flex; flex-direction:column; justify-content:center; gap:9px}
.contact-links a{min-height:52px; padding:0 15px; display:flex; align-items:center; justify-content:space-between; border:1px solid var(--line); font:9px var(--mono); letter-spacing:.1em}
.contact-links a:hover{border-color:var(--lilac); background:rgba(36,107,254,.08)}
.contact-links b{color:var(--lilac); font-size:16px; font-weight:400}
.footer{padding:27px 0; border-top:1px solid var(--line); color:var(--quiet); font:9px var(--mono); letter-spacing:.1em}
.footer-inner{display:flex; justify-content:space-between; gap:15px}
.footer button{border:0; background:none; color:var(--lilac); font:inherit; letter-spacing:inherit}
@media(max-width:950px){.desktop-nav{gap:0}
.nav-link{padding:0 8px; font-size:8px}
.github-link span{display:none}
.hero-grid{gap:4vw}
.hero-title{font-size:clamp(66px,10vw,110px)}
.project-grid,.repo-grid{grid-template-columns:repeat(2,1fr)}
.member-grid{gap:10px}
.work-row{grid-template-columns:45px 1fr 1.1fr auto}}
@media(max-width:700px){.creator-panel{grid-template-columns:1fr; padding:22px; margin-top:52px}
.creator-page-grid{grid-template-columns:1fr}
.creator-list{grid-template-columns:1fr 1fr}:root{--header:66px}
.wrap{width:89vw}
.desktop-nav,.github-link{display:none}
.menu-toggle{display:flex}
.hero{padding:65px 0 55px}
.hero-grid{grid-template-columns:1fr; gap:36px}
.hero-title{font-size:clamp(72px,16vw,112px)}
.hero-art{width:min(78%,340px); justify-self:end; margin-right:8px}
.hero-index{right:-22px}
.hero-description{font-size:13px}
.ticker-track{justify-content:flex-start; gap:32px}
.home-sections{padding:60px 0 75px}
.collective-band{grid-template-columns:1fr; gap:22px; margin-top:65px; padding-top:48px}
.collective-image{height:220px}
.container{padding:50px 0 75px}
.section-top{align-items:start; flex-direction:column; gap:15px; margin-bottom:30px}
.section-top h1{font-size:clamp(49px,12vw,74px)}
.section-top p{font-size:12px}
.member-grid{grid-template-columns:repeat(2,1fr)}
.member-card:last-child{grid-column:span 2}
.member-banner{height:145px}
.profile-card{grid-template-columns:1fr; gap:12px; margin-top:-42px}
.profile-aside{order:2; margin:0 18px 20px}
.profile-main{padding-inline:18px}
.profile-avatar{width:92px; height:92px}
.about-layout{grid-template-columns:1fr; gap:25px}
.value-grid{grid-template-columns:1fr 1fr}
.work-row{grid-template-columns:38px 1fr auto; gap:12px}
.work-row p{grid-column:2 / 4}
.work-type{display:none}
.contact-panel{grid-template-columns:1fr; padding:24px; gap:25px}
.repo-tools{align-items:stretch; flex-direction:column}
.repo-search{width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important; animation-duration:.01ms!important; transition-duration:.01ms!important}}
/* Colour system and image proportions */ body:before{background:radial-gradient(ellipse at 8% 12%,rgba(20,156,145,.20),transparent 32%),radial-gradient(ellipse at 88% 18%,rgba(227,179,76,.23),transparent 29%),radial-gradient(ellipse at 72% 82%,rgba(240,120,79,.15),transparent 31%),radial-gradient(ellipse at 36% 100%,rgba(36,107,254,.11),transparent 34%)}
body:after{opacity:.035}
.site-header{background:rgba(242,240,232,.88)}
.eyebrow{color:#167e75}::selection{background:var(--acid); color:#192b29}
#progress{background:linear-gradient(90deg,#149c91,#246bfe,#e3b34c,#f0784f)}
.button.primary{background:#192b29; color:#fffdf7; border-color:#192b29}
.button.primary:hover{background:#246bfe; border-color:#246bfe; color:white}
.hero-art{aspect-ratio:1/1; max-width:430px; background:linear-gradient(135deg,#d7e8df,#f5dfbd); border-color:rgba(25,43,41,.2)}
.hero-art img{object-fit:contain; object-position:center; background:transparent}
.hero-art:after{background:linear-gradient(180deg,transparent 62%,rgba(25,43,41,.55))}
.art-label{color:#fff}

<script>
(() => {

];
const PROJECTS=[
{

,
{

,

,
{

,

id:"moonflower",name:"Moonflower",type:"PERSONAL SPACE",status:"ACTIVE",description:"The home for personal web experiments, project pages, and The Forged Flowers identity.",repo:"https://github.com/dhisjwhd-svg/moonflower",symbol:"✿",glow:"#e0a4c4"}
,

];
const app=document.getElementById("app"),mobileNav=document.getElementById("mobile-nav"),menuToggle=document.getElementById("menu-toggle"),progress=document.getElementById("progress");
document.getElementById("year").textContent=new Date().getFullYear();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const button=(label,route,primary=false)=>'<button class="button '+(primary?'primary':'')+'" data-route="'+esc(route)+'">'+esc(label)+' <span class="arrow">↗</span></button>';
const ext=(label,url)=>'<a class="button" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+' <span class="arrow">↗</span></a>';
const heading=(tag,title,desc)=>'<header class="section-top"><div><div class="eyebrow">'+esc(tag)+'</div><h1>'+title+'</h1></div><p>'+esc(desc)+'</p></header>';
function home(){return '<section class="page"><div class="wrap hero"><div class="hero-grid"><div><div class="hero-kicker eyebrow">MOON.D.FLOWER / INDEPENDENT CREATOR</div><h1 class="hero-title">Ideas into<br><span class="line2">real things.</span></h1><p class="hero-description"><strong>I’m moon.d.flower.</strong> I build websites, experiment with interactive interfaces, and create digital spaces around the things I’m interested in. This is where the projects, the process, and <strong>The Forged Flowers</strong> come together.</p><div class="hero-actions">'+button("EXPLORE MY WORK","work",true)+ext("FOLLOW ON TIKTOK","https://www.tiktok.com/@moon.d.flower")+'</div><div class="micro" style="margin-top:30px">WEB BUILDS / INTERFACES / CREATIVE PROJECTS</div></div><figure class="hero-art"><img src="'+ASSET.moonAvatar+'" alt="Moon.d.flower profile artwork" fetchpriority="high"><figcaption class="art-label"><span>MOON.D.FLOWER</span><span>THE CREATOR</span></figcaption><span class="hero-index">THE FORGED FLOWERS · 2026</span></figure></div></div><div class="ticker"><div class="wrap ticker-track"><span>BUILD <b>✳</b></span><span>CREATE <b>✳</b></span><span>EXPERIMENT <b>✳</b></span><span>REFINE <b>✳</b></span><span>THE FORGED FLOWERS <b>✳</b></span></div></div><div class="wrap home-sections"><div class="section-heading"><div><div class="eyebrow">SELECTED WORK</div><h2>Things taking<br><em class="serif">shape.</em></h2></div><button class="text-link" data-route="work">ALL PROJECTS ↗</button></div>'+projectCards(PROJECTS.slice(0,3))+'<section class="creator-panel"><div><div class="eyebrow">THE CREATOR / @MOON.D.FLOWER</div><h2>More than a<br><em class="serif">profile link.</em></h2><p>I share my creative work and the ideas behind it. The TikTok profile is the best place to see the videos I’ve actually posted; this site gives the projects more room and context.</p><div class="creator-actions">'+ext("VIEW MY TIKTOK","https://www.tiktok.com/@moon.d.flower")+'<button class="button" data-route="creator">WHAT I CREATE ↗</button></div></div><div class="creator-list"><div class="creator-item"><b>Websites & interactive builds</b><span>Custom HTML projects, browser experiences, and working interfaces.</span></div><div class="creator-item"><b>Digital spaces & media projects</b><span>Organizing content, app-style layouts, and connected project libraries.</span></div><div class="creator-item"><b>Visual identity</b><span>Project artwork, banners, icons, and a consistent look across the work.</span></div></div></section><div class="collective-band"><div><div class="eyebrow">THE PEOPLE BEHIND IT</div><h2>Different minds.<br><em>One collective.</em></h2><p>The Forged Flowers is the team connected to this space. Meet the members and explore their individual profiles.</p>'+button("MEET THE COLLECTIVE","team")+'</div><div class="collective-image"><img src="'+ASSET.moonBanner+'" alt="Moonflower banner artwork" loading="lazy"></div></div></div></section>'}
function projectCards(items){return '<div class="project-grid">'+items.map((p,i)=>'<a class="project-card" style="--glow:'+p.glow+'" href="'+esc(p.repo)+'" target="_blank" rel="noopener noreferrer"><div class="project-top"><span>0'+(i+1)+' / '+esc(p.type)+'</span><span class="project-mark">'+p.symbol+'</span></div><h3>'+esc(p.name)+'</h3><p>'+esc(p.description)+'</p><div class="project-bottom"><span>'+esc(p.status)+'</span><b>↗</b></div></a>').join("")+'</div>'}
function about(){return '<section class="page container"><div class="wrap">'+heading("THE IDEA","About <em>Moonflower.</em>","A little context on the person, the collective, and why this space exists.")+'<div class="about-layout"><div class="about-quote">“Make the thing. See what works. Keep <em>making it better.</em>”</div><div class="about-copy"><p>I’m <strong>moon.d.flower</strong>. I like building websites, experimenting with interfaces, and turning ideas into projects that people can actually use.</p><p>A lot of the work lives somewhere between design and development: the layout, the little details, the way a page moves, and the code that makes everything function instead of just look good.</p><p><strong>The Forged Flowers</strong> is the collective connected to this space. This site gives the people and the projects room to exist together without turning everything into one giant profile page.</p><p>Nothing here needs to pretend it is finished. Projects change, designs get rebuilt, and the work keeps moving.</p></div></div><div class="value-grid"><article class="value-card"><span class="num">01 / BUILD</span><h3>Useful interfaces</h3><p>Web pages, app-like experiences, navigation, and details that work across devices.</p></article><article class="value-card"><span class="num">02 / CREATE</span><h3>A visual identity</h3><p>Artwork, banners, icons, and a consistent look that gives each project its own character.</p></article><article class="value-card"><span class="num">03 / IMPROVE</span><h3>Keep refining</h3><p>Testing the real experience, finding what breaks, and fixing it instead of leaving it half-done.</p></article></div><div style="margin-top:35px">'+button("SEE THE PROJECTS","work",true)+'</div></div></section>'}
function team(){return '<section class="page container"><div class="wrap">'+heading("THE COLLECTIVE","The Forged <em>Flowers.</em>","Meet the members. Open a profile to see their banner, picture, bio, and public links.")+'<div class="member-grid">'+MEMBERS.map((m,i)=>'<button class="member-card" data-route="member/'+m.id+'"><div class="member-banner"><img src="'+m.banner+'" alt="'+esc(m.name)+' banner" loading="lazy"></div><div class="member-body"><img class="member-avatar" src="'+m.avatar+'" alt="'+esc(m.name)+' profile picture" loading="lazy"><div class="member-role">'+esc(m.role.toUpperCase())+'</div><h2 class="member-name">'+esc(m.name)+'</h2><div class="member-handle">'+esc(m.handle)+'</div><p class="member-bio">'+esc(m.bio)+'</p><div class="member-foot"><span>PROFILE 00'+(i+1)+'</span><b>↗</b></div></div></button>').join("")+'</div></div></section>'}
function member(id){const m=MEMBERS.find(x=>x.id===id);if(!m)return notFound();const i=MEMBERS.indexOf(m);return '<section class="page container"><div class="wrap"><div class="eyebrow" style="margin-bottom:18px"><button class="text-link" data-route="team">← THE COLLECTIVE</button> / PROFILE 00'+(i+1)+'</div><div class="profile-cover"><img src="'+m.banner+'" alt="'+esc(m.name)+' banner"></div><div class="profile-card"><article class="profile-main"><img class="profile-avatar" src="'+m.avatar+'" alt="'+esc(m.name)+' profile picture"><div class="eyebrow" style="margin-top:17px">'+esc(m.role.toUpperCase())+'</div><h1>'+esc(m.name)+'</h1><div class="profile-handle">'+esc(m.handle)+'</div><p class="profile-bio">'+esc(m.bio)+'</p><div class="profile-links">'+(m.links.length?m.links.map(l=>'<a class="social" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">↗ '+esc(l.label)+'</a>').join(""):'<span class="micro">NO PUBLIC LINKS LISTED</span>')+'</div></article><aside class="profile-aside"><div class="eyebrow">MEMBER NOTE</div><h3>'+esc(m.name)+'</h3><p>'+esc(m.note)+'</p><button class="button" data-route="team">ALL MEMBERS ↗</button><button class="button" data-route="contact">CONNECT ↗</button></aside></div></div></section>'}
function work(){return '<section class="page container"><div class="wrap">'+heading("THE WORKSHOP","Projects & <em>experiments.</em>","A look at the repositories and ideas being built. Each card opens its actual source repository.")+projectCards(PROJECTS)+'<div class="collective-band"><div><div class="eyebrow">FOLLOW THE SOURCE</div><h2>Work in<br><em>progress.</em></h2><p>For the latest files, commits, and changes, open the project repositories directly.</p>'+ext("OPEN GITHUB PROFILE","https://github.com/dhisjwhd-svg")+'</div><div class="collective-image"><img src="'+ASSET.directory+'" alt="Directory app artwork" loading="lazy"></div></div></div></section>'}
function repositories(){return '<section class="page container"><div class="wrap">'+heading("PUBLIC SOURCE","Open-source <em>trail.</em>","A live list of public repositories from the GitHub profile. Search the names and descriptions.")+'<div class="repo-tools"><span class="eyebrow" id="repo-count">PUBLIC REPOSITORIES / LOADING</span><input class="repo-search" id="repo-search" type="search" placeholder="Search repositories…" aria-label="Search repositories"></div><div class="repo-grid" id="repo-grid"><div class="state">Connecting to GitHub…</div></div><div style="margin-top:25px">'+ext("OPEN GITHUB PROFILE","https://github.com/dhisjwhd-svg")+'</div></div></section>'}
function creator(){return '<section class="page container"><div class="wrap">'+heading("THE CREATOR","Moon.d.flower <em>online.</em>","A clearer look at the kind of work behind this profile and where to follow the latest posts.")+'<div class="about-layout"><div class="about-quote">“I like turning an idea into something you can <em>actually use.</em>”</div><div class="about-copy"><p>I’m <strong>moon.d.flower</strong>, an independent creator interested in building things for the web. I work across the visual side and the technical side: planning a layout, shaping its identity, writing the code, and improving how it works.</p><p>My projects include browser-based desktop ideas, media-library interfaces, asset collections, and smaller interactive experiments. They are works in progress, and I keep refining them as I learn.</p><p>I also share creative work through TikTok. This page intentionally does not invent video titles, view counts, or a content schedule; the profile below is the source for my actual posts.</p></div></div><div class="creator-page-grid"><article class="creator-page-card"><span class="num">01 / BUILD</span><h3>Web development</h3><p>Single-file HTML projects, responsive layouts, interactive navigation, and app-like browser experiences.</p></article><article class="creator-page-card"><span class="num">02 / DESIGN</span><h3>Interface & visual design</h3><p>Dark interfaces, custom branding, image systems, icons, and details that make each project feel coherent.</p></article><article class="creator-page-card"><span class="num">03 / EXPERIMENT</span><h3>Digital projects</h3><p>Lumio OS, media-library concepts, project directories, and other experiments built around real use cases.</p></article><article class="creator-page-card"><span class="num">04 / SHARE</span><h3>Creator updates</h3><p>Follow the TikTok profile to see the videos and ideas I’ve published directly, rather than a made-up feed embedded here.</p></article></div><div class="contact-panel" style="margin-top:32px"><div><div class="eyebrow">TIKTOK / @MOON.D.FLOWER</div><h2>Find me<br><em>over there.</em></h2><p>Visit the original profile for the latest videos and creator updates.</p></div><div class="contact-links"><a href="https://www.tiktok.com/@moon.d.flower" target="_blank" rel="noopener noreferrer"><span>OPEN TIKTOK PROFILE</span><b>↗</b></a><a href="https://github.com/dhisjwhd-svg" target="_blank" rel="noopener noreferrer"><span>EXPLORE MY GITHUB</span><b>↗</b></a><a href="https://github.com/dhisjwhd-svg/LUMIO-OS" target="_blank" rel="noopener noreferrer"><span>VIEW LUMIO OS</span><b>↗</b></a></div></div></div></section>'}
function contact(){return '<section class="page container"><div class="wrap">'+heading("FIND THE WORK","Stay <em>connected.</em>","Public places to follow the projects and find the original files.")+'<div class="contact-panel"><div><div class="eyebrow">MOON.D.FLOWER / THE FORGED FLOWERS</div><h2>See what<br><em>comes next.</em></h2><p>Browse the work, visit the source repositories, or check out the team profiles. The projects are always evolving.</p></div><div class="contact-links"><a href="https://github.com/dhisjwhd-svg" target="_blank" rel="noopener noreferrer"><span>GITHUB PROFILE</span><b>↗</b></a><a href="https://www.tiktok.com/@moon.d.flower" target="_blank" rel="noopener noreferrer"><span>TIKTOK / MOON.D.FLOWER</span><b>↗</b></a><a href="https://github.com/dhisjwhd-svg/moonflower" target="_blank" rel="noopener noreferrer"><span>MOONFLOWER REPOSITORY</span><b>↗</b></a><a href="https://github.com/dhisjwhd-svg/lumio-assets" target="_blank" rel="noopener noreferrer"><span>LUMIO ASSETS</span><b>↗</b></a></div></div></div></section>'}
function notFound(){return '<section class="page container"><div class="wrap"><div class="eyebrow">404 / NOT FOUND</div><h1 style="font-size:clamp(60px,10vw,110px);letter-spacing:-.1em">Wrong<br><em class="serif">turn.</em></h1><p class="muted">That page does not exist here.</p>'+button("BACK HOME","home",true)+'</div></section>'}
const routes={home,about,creator,team,work,repositories,contact};
function parse(){const bits=location.hash.replace(/^#\/?/,"").split("/");const name=bits[0]||"home";return{name:routes[name]||(["member"].includes(name)?member:notFound),key:name,id:bits[1]||""}}
function render(){const r=parse();app.innerHTML=r.key==="member"?member(r.id):(routes[r.key]||notFound)();document.querySelectorAll(".nav-link").forEach(n=>n.classList.toggle("active",n.dataset.route===r.key||(r.key==="member"&&n.dataset.route==="team")));mobileNav.classList.remove("open");menuToggle.setAttribute("aria-expanded","false");menuToggle.textContent="☰";document.title=(r.key==="member"?(MEMBERS.find(m=>m.id===r.id)?.name||"Member"):r.key==="home"?"Moonflower":r.key.charAt(0).toUpperCase()+r.key.slice(1))+" — The Forged Flowers";window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});if(r.key==="repositories")loadRepoView()}
function navigate(route){const hash="#"+route;if(location.hash===hash)render();else location.hash=hash}
document.addEventListener("click",e=>{const el=e.target.closest("[data-route]");if(!el)return;e.preventDefault();navigate(el.dataset.route)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&mobileNav.classList.contains("open")){mobileNav.classList.remove("open");menuToggle.setAttribute("aria-expanded","false");menuToggle.textContent="☰"}});
window.addEventListener("hashchange",render);
menuToggle.addEventListener("click",()=>{const open=mobileNav.classList.toggle("open");menuToggle.setAttribute("aria-expanded",String(open));menuToggle.textContent=open?"×":"☰"});
window.addEventListener("scroll",()=>{const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max>0?scrollY/max*100:0)+"%"},{passive:true});
async function loadRepoView(){const grid=document.getElementById("repo-grid"),count=document.getElementById("repo-count"),search=document.getElementById("repo-search");if(!grid||grid.dataset.loaded)return;try{const repos=await getRepos();if(!document.body.contains(grid))return;count.textContent="PUBLIC REPOSITORIES / "+repos.length;const paint=()=>{const q=(search.value||"").trim().toLowerCase(),filtered=repos.filter(r=>(r.name+" "+(r.description||"")+" "+(r.language||"")).toLowerCase().includes(q));grid.innerHTML=filtered.length?filtered.map(r=>'<a class="repo-card" href="'+esc(r.html_url)+'" target="_blank" rel="noopener noreferrer"><span class="eyebrow">REPOSITORY</span><h3>'+esc(r.name)+'</h3><p>'+esc(r.description||"A public project from Moonflower.")+'</p><span class="repo-foot"><span>'+esc((r.language||"PROJECT").toUpperCase())+'</span><span>OPEN ↗</span></span></a>').join(""):'<div class="state">No repositories match that search.</div>'};search.addEventListener("input",paint);paint();grid.dataset.loaded="true"}catch(err){if(!document.body.contains(grid))return;count.textContent="GITHUB PROFILE";grid.innerHTML='<div class="state">GitHub could not return the live repository list right now. You can still open the profile directly.</div>'}}
render();
})();
</script>
